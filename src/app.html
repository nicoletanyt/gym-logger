<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply the saved preference before the first paint, including on auth pages.
			try {
				const preference = localStorage.getItem('gym-logger-theme');
				const dark = preference === 'dark' || ((preference !== 'light' && preference !== 'dark') && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			} catch {
				document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
